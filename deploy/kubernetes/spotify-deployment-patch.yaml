# Strategic merge patch for an EXISTING deployment, not a standalone manifest.
# Adjust the deployment/container names and image before using it.
# Keep any existing PVC, Service, ingress and Navidrome configuration unchanged.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: navilist
spec:
  replicas: 1
  strategy:
    type: Recreate
    rollingUpdate: null
  template:
    spec:
      containers:
        - name: navilist
          image: YOUR_REGISTRY/navilist:spotify-test
          env:
            - name: SPOTIFY_TOKEN_KEY
              valueFrom:
                secretKeyRef:
                  name: navilist-spotify
                  key: SPOTIFY_TOKEN_KEY
